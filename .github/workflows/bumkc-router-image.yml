name: BUMKC router image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: bumkc-v1.4.1-dynamo-compat
      image_tag:
        description: GHCR image tag
        required: true
        default: bumkc-v1.4.1-dynamo-compat-5843658

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build router image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push router image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: router-image
          platforms: linux/amd64
          push: true
          tags: ghcr.io/spencergarnets/smg:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
